<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS setup</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --card: #ffffff;
        --fg: #0a0a0a;
        --muted: #737373;
        --border: #e5e5e5;
        --primary: #171717;
        --primary-fg: #fafafa;
        --danger: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #171717;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --border: #262626;
          --primary: #fafafa;
          --primary-fg: #171717;
          --danger: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { color: var(--muted); margin: 0 0 20px; }
      label { display: block; font-weight: 500; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      #error { color: var(--danger); margin-top: 12px; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect this till</h1>
      <p>Enter the address of your POS server. You only need to do this once on this computer.</p>
      <form id="form">
        <label for="server">Server address</label>
        <input id="server" name="server" type="url" placeholder="https://pos.example.com/api" required autofocus />
        <button id="submit" type="submit">Connect</button>
        <div id="error" role="alert"></div>
      </form>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
